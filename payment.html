<!DOCTYPE HTML>
<html>
  <head>
    <title>Payment | SMIRGLPAPIR</title>
    <meta charset="utf-8" />

  <body class="is-preload">
    <div id="wrapper" class="divided">
      <section class="wrapper style1 align-left">
        <div class="inner" style="padding: 5rem 2.5rem 0 2.5rem; max-width: 42rem;">
          <h2 class="align-left">Complete Payment</h2>
          <p>Please scan the QR code and finish your bank transfer. Once completed, confirm below.</p>

          <div class="shop-thankyou-box">
            <div class="shop-payment-qr-wrap">
              <img id="payment-qr-image" class="shop-payment-qr-image" alt="Payment QR code" hidden />

            <div class="shop-payment-confirm-wrap">
              <button id="payment-confirm" type="button" class="button primary">Confirm payment</button>
            </div>
            <div class="shop-payment-back-wrap">
              <a href="checkout.html" class="button">Back to Checkout</a>
            </div>
            <p id="payment-qr-hint" class="shop-payment-note" hidden>Payment QR code is unavailable. Please return to checkout and try again.</p>
          </div>

          <p id="payment-error" class="shop-error" aria-live="polite"></p>
        </div>
      </section>

      <footer class="wrapper style1 align-center">
        <div class="inner">
          <ul class="icons">
            <li><a href="https://www.instagram.com/smirglpapir.crafts/" target="_blank" class="icon brands style2 fa-instagram"><span class="label">Instagram</span></a></li>

          </ul>
