<!DOCTYPE HTML>
<html>
	<head>
		<title>Calendar | SMIRGLPAPIR</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css?v=20260706d" />
		<link rel="icon" type="image/png" href="images/icon.png">
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">

		<div id="wrapper" class="divided">
			<section class="wrapper style1 align-left">
				<div class="inner" style="padding: 5rem 2.5rem 0 2.5rem;">
					<h2 class="align-left">Workshops, Markets & More</h2>
					<p class="subsections">See where we can meet next. Click a date to open all the little details.</p>
				</div>

				<div id="calendar-app" class="inner calendar-app" style="padding-top: 1.5rem;">
					<div class="calendar-shell">
						<div class="calendar-toolbar">
							<button id="calendar-prev-month" class="button small" type="button">Previous</button>
							<h3 id="calendar-month-label" class="calendar-month-label">Month</h3>
							<button id="calendar-next-month" class="button small" type="button">Next</button>
						</div>

						<div id="calendar-grid" class="calendar-grid" aria-label="Calendar grid"></div>
					</div>

					<aside class="calendar-details" aria-live="polite">
						<h3 id="calendar-event-title">Event Details</h3>
						<div id="calendar-event-list"></div>
						<p id="calendar-load-error" class="shop-error"></p>
						<p class="calendar-contact-note">For private workshop requests, contact <a href="mailto:info@smirglpapir.com">info@smirglpapir.com</a>.</p>
					</aside>
				</div>
			</section>

			<footer class="wrapper style1 align-center">
				<div class="inner">
					<ul class="icons">
						<li><a href="https://www.instagram.com/smirglpapir.crafts/" target='_blank' class="icon brands style2 fa-instagram"><span class="label">Instagram</span></a></li>
						<li><a href="mailto:info@smirglpapir.com" class="icon style2 fa-envelope"><span class="label">Email</span></a></li>
					</ul>
					<p>&copy; SMIRGLPAPIR</p>
				</div>
			</footer>
		</div>

		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.scrollex.min.js"></script>
		<script src="assets/js/jquery.scrolly.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
		<script src="assets/js/calendar.js?v=20260722c"></script>

	</body>
</html>
